function home(){return `<div class="hero home-hero"><div class="hero-content"><span class="eyebrow">一起做甜點，一起留下回憶</span><h1>讓每次烘焙，<br>成為下一次相聚的開始。</h1><p class="muted">揪朋友、玩挑戰、收藏你們的甜蜜時刻。</p><button class="btn" onclick="start('food','strawberry')">開始揪團 ${icon('arrow')}</button></div></div><section class="section"><h3>這次想做什麼？</h3><p class="muted">自己參加、建立房間邀朋友，或在公開大廳加入其他人的活動。</p><div class="grid">${foods.map(f=>`<button class="tile" onclick="start('food','${f.id}')">${photo(f.img,'')}<div><strong>${f.name}</strong><p class="muted" style="margin:4px 0">選擇參與方式 ${icon('arrow',14)}</p></div></button>`).join('')}</div></section><section class="section"><div class="row"><h3>門市合作挑戰</h3><button class="btn secondary small" onclick="go('events')">查看全部</button></div>${events.slice(0,2).map(eventCard).join('')}</section><p class="notice">本網站為企劃示範原型，活動日期與門市均為模擬資料，非正式預約。</p>`}
function eventCard(e){return `<div class="card mini-card">${photo(e.img,'thumb')}<div><span class="pill">門市挑戰</span><h3 style="margin-top:7px">${e.name}</h3><p class="muted" style="margin:4px 0">${e.desc}<br>${e.date} · 示範場次</p><button class="btn small" onclick="start('event','${e.id}')">選擇參與方式</button></div></div>`}
function create(){let x=item(selection.kind,selection.id)||foods[0];return `<h2>確認你的烘焙體驗</h2><div class="card mini-card">${photo(x.img,'thumb')}<div><span class="pill">${selection.kind==='event'?'門市挑戰':'甜點體驗'}</span><h3>${x.name}</h3><button class="btn secondary small" onclick="go('${selection.kind==='event'?'events':'home'}')">更換主題</button></div></div><h3 class="section">選擇參加方式</h3>${[['solo','自己參加','單人參加，不需要揪團','user'],['room','建立揪團房間','可邀請朋友，也能公開讓其他人加入','users'],['browse','加入其他房間','瀏覽公開揪團，像遊戲大廳一樣加入','store']].map(([m,t,d,i])=>`<button class="option ${selection.mode===m?'selected':''}" onclick="selection.mode='${m}';render()">${icon(i)}<span><strong>${t}</strong><br><small class="muted">${d}</small></span>${selection.mode===m?icon('check'):''}</button>`).join('')}${selection.mode==='browse'?`<button class="btn full" onclick="go('groups')">前往公開房間大廳 ${icon('arrow')}</button>`:`<div class="card"><div class="field"><label>活動日期</label><input type="date" id="date" value="2026-12-05" min="2026-11-20"></div><div class="field"><label>活動時間</label><input type="time" id="time" value="14:00"></div><div class="field"><label>示範門市</label><select id="store"><option>台中示範門市</option><option>台北示範門市</option><option>高雄示範門市</option><option>門市待確認</option></select></div>${selection.mode==='solo'?'':`<div class="field"><label>房間人數（包含自己）</label><select id="limit"><option value="2">2 人</option><option value="3">3 人</option><option value="4" selected>4 人</option><option value="5">5 人</option><option value="6">6 人</option></select></div><div class="field"><label>房間可見性</label><select id="visibility"><option value="public">公開房間｜顯示於大廳，也可分享論壇</option><option value="private">私人房間｜僅限房間碼或邀請連結</option></select></div><label class="checkline"><input type="checkbox" id="approval" checked> 新成員加入需房主審核</label>`}<div class="field"><label>暱稱</label><input id="nickname" value="我" maxlength="20"></div><button class="btn full" onclick="createGroup()">${selection.mode==='solo'?'建立單人體驗':'建立房間並開啟聊天室'}</button></div>`}<p class="notice">示範版房間與聊天室資料只儲存在本機；公開大廳不會真的發布到網路。</p>`}

function createGroup(){let name=el('nickname').value.trim(),date=el('date').value;if(!name||!date){toast('請填寫暱稱與日期');return}let solo=selection.mode==='solo';let g={id:'g'+Date.now().toString(36),kind:selection.kind,itemId:selection.id,mode:solo?'solo':'room',visibility:solo?'private':el('visibility').value,approval:!solo&&el('approval').checked,date,time:el('time').value,store:el('store').value,limit:Number(el('limit')?.value||1),members:[name],messages:[{who:'系統',text:'房間已建立！可以在這裡討論活動。'}],status:'準備中'};data.groups.unshift(g);save();activeId=g.id;go('detail');toast('房間建立成功')}

function groups(){let publicRooms=data.groups.filter(g=>g.mode!=='solo'&&g.visibility==='public');let privateRooms=data.groups.filter(g=>g.visibility==='private'||g.mode==='solo');return `<div class="row"><h2>揪團房間大廳</h2><button class="btn small" onclick="start('food','strawberry')">${icon('plus')} 建立</button></div><p class="muted">公開房間任何人都能探索；私人房間只透過邀請碼加入。</p><div class="card"><div class="field"><label>使用房間碼加入</label><div class="chatinput"><input id="roomCode" placeholder="輸入房間碼"><button class="btn" onclick="joinByCode()">加入</button></div></div></div><h3 class="section">公開房間 <span class="pill">示範房間</span></h3>${publicRooms.length?publicRooms.map(g=>groupCard(g)).join(''):'<div class="empty">還沒有公開房間，可以建立一間並分享至論壇。</div>'}<h3 class="section">私人房間與單人活動</h3>${privateRooms.length?privateRooms.map(g=>groupCard(g)).join(''):'<div class="empty">目前沒有私人房間。</div>'}<p class="notice">這是本機原型：公開房間僅顯示此瀏覽器建立的資料，跨使用者加入需串接後端。</p>`}

function groupCard(g){let x=item(g.kind,g.itemId)||foods[0];return `<div class="card mini-card">${photo(x.img,'thumb')}<div><span class="pill">${g.mode==='solo'?'單人':g.visibility==='public'?'公開房間':'私人房間'}${g.id.startsWith('BL-')?' · 範例':''}</span><h3 style="margin-top:8px">${esc(x.name)}</h3><p class="muted">${esc(g.date)} · ${g.members.length}/${g.limit} 人 · ${g.approval?'需審核':'自由加入'}</p><button class="btn small" onclick="activeId='${g.id}';go('detail')">查看房間</button></div></div>`}

function detail(){let g=getGroup();if(!g)return groups();let x=item(g.kind,g.itemId)||foods[0];return `<h2>房間詳情</h2><div class="card">${photo(x.img)}<h3 style="margin-top:15px">${esc(x.name)}</h3><span class="pill">${g.mode==='solo'?'單人活動':g.visibility==='public'?'公開房間':'私人房間'}</span><p class="muted">${icon('calendar',16)} ${esc(g.date)} ${esc(g.time)}<br>${esc(g.store)}<br>${g.members.length} / ${g.limit} 人</p>${g.mode!=='solo'?`<p class="muted">房間碼：<strong>${esc(g.id)}</strong> · ${g.approval?'房主審核加入':'自由加入'}</p>`:''}<div class="divider"></div><h3>房間成員</h3>${g.members.map(m=>`<p>${icon('user',16)} ${esc(m)}</p>`).join('')}<div class="divider"></div>${g.mode!=='solo'?`<button class="btn secondary full" onclick="copyInvite()">${icon('share')} 分享房間資訊至朋友或論壇</button><button class="btn secondary full" style="margin-top:9px" onclick="simulateJoin()">${icon('plus')} 模擬其他人申請加入</button>`:''}<button class="btn full" style="margin-top:9px" onclick="go('chat')">${icon('message')} 進入房間聊天室</button><button class="btn secondary full" style="margin-top:9px" onclick="go('addMemory')">${icon('camera')} 體驗完成，新增回憶</button></div><p class="notice">房間加入、審核與聊天室為本機模擬，正式版才會跨裝置同步。</p>`}

function simulateJoin(){let g=getGroup();if(g.members.length>=g.limit){toast('房間已額滿');return}let names=['小米','家瑜','阿辰','小安','新朋友'];let n=names.find(n=>!g.members.includes(n))||'新夥伴';if(g.approval&&!confirm(n+' 申請加入房間，房主是否同意？')){toast('已拒絕申請');return}g.members.push(n);g.messages.push({who:'系統',text:n+' 已加入房間'},{who:n,text:'大家好！期待一起做甜點！'});save();render();toast('模擬夥伴已加入')}
function joinByCode(){let id=el('roomCode').value.trim();let g=data.groups.find(g=>g.id===id);if(!g){toast('找不到房間，示範版僅能加入本機房間');return}activeId=g.id;go('detail')}

function copyInvite(){let g=getGroup();let x=item(g.kind,g.itemId);let t=`BakeLoop 邀請｜${x.name}\n${g.date} ${g.time}\n${g.store}\n房間碼：${g.id}\n此為本機示範活動，無法跨裝置同步。`;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('邀請資訊已複製')).catch(()=>prompt('複製邀請資訊',t));else prompt('複製邀請資訊',t)}
function chat(){let g=getGroup();if(!g)return groups();return `<div class="row"><h2>活動聊天室</h2><button class="btn secondary small" onclick="go('detail')">返回詳情</button></div><p class="muted">${esc(item(g.kind,g.itemId).name)} · ${g.members.length} 位夥伴</p><div class="chat" id="messages">${g.messages.map(m=>`<div class="bubble ${m.who===g.members[0]?'mine':''}"><small>${esc(m.who)}</small>${esc(m.text)}</div>`).join('')}</div><form class="chatinput" onsubmit="sendMessage(event)"><input id="msg" maxlength="300" placeholder="和大家打聲招呼…" required><button class="btn" type="submit">傳送</button></form><p class="notice">聊天室內容只存在本機。正式版建議加入封鎖、檢舉及離開群組功能，陌生人配對需有隱私與安全機制。</p>`}
function sendMessage(e){e.preventDefault();let g=getGroup(),t=el('msg').value.trim();if(!t)return;g.messages.push({who:g.members[0],text:t});save();render();el('messages').scrollTop=el('messages').scrollHeight;el('msg').focus()}
function eventsPage(){return `<h2>門市挑戰</h2><p class="muted">選擇挑戰後，可以單人參加、建立公開或私人房間，也可以加入其他人的房間。</p>${events.map(eventCard).join('')}<p class="notice">挑戰以裝飾、合作及創意設計為主，實際活動須遵循門市設備安全規範。</p>`}
function memoryCard(m,isSample){return `<div class="card">${m.data?`<img class="cover" src="${m.data}" alt="作品照片">`:photo(m.img||'strawberry-cake.jpg')}<h3 style="margin-top:14px">${esc(m.title)} ${(isSample||m.id.startsWith('demo-'))?'<span class="pill">範例</span>':''}</h3><p class="muted">${esc(m.date)} · ${esc(m.people)}</p><p>${esc(m.note)}</p><div class="row"><button class="btn secondary small" onclick="shareMemory('${m.id}',${isSample})">${icon('share',16)} 分享回憶</button><button class="btn small" onclick="start('food','${m.foodId||'strawberry'}')">再次邀約</button></div></div>`}
function memories(){return `<div class="row"><h2>作品回憶</h2><button class="btn small" onclick="go('addMemory')">${icon('plus')} 新增</button></div><p class="muted">保存每次烘焙的照片、夥伴與故事。</p>${data.memories.length?`<h3 class="section">我的作品</h3>${data.memories.map(m=>memoryCard(m,false)).join('')}`:''}<h3 class="section">精選回憶範例</h3>${samples.map(m=>memoryCard(m,true)).join('')}`}
function shareMemory(id,isSample){let m=(isSample?samples:data.memories).find(m=>m.id===id);let t=`BakeLoop｜${m.title}\n${m.date}\n${m.note}`;if(navigator.share)navigator.share({title:m.title,text:t}).catch(()=>{});else if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('回憶文字已複製')).catch(()=>prompt('分享回憶',t));else prompt('分享回憶',t)}
function addMemory(){return `<h2>新增作品回憶</h2><div class="card"><div class="field"><label>作品照片（選填）</label><input id="memfile" type="file" accept="image/*"></div><div class="field"><label>作品名稱</label><input id="memtitle" placeholder="例如：我們的草莓蛋糕"></div><div class="field"><label>甜點種類</label><select id="memfood">${foods.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select></div><div class="field"><label>日期</label><input id="memdate" type="date" value="2026-11-20"></div><div class="field"><label>參與夥伴</label><input id="mempeople" placeholder="例如：小晴、阿哲、我"></div><div class="field"><label>當天的故事</label><textarea id="memnote" placeholder="寫下有趣的回憶…"></textarea></div><button class="btn full" onclick="saveMemory()">儲存作品回憶</button></div>`}
function saveMemory(){let title=el('memtitle').value.trim();if(!title){toast('請輸入作品名稱');return}let f=el('memfile').files[0];if(f&&f.size>3*1024*1024){toast('照片請小於 3MB');return}let foodId=el('memfood').value;let commit=dataUrl=>{data.memories.unshift({id:'m'+Date.now(),title,date:el('memdate').value,people:el('mempeople').value||'我',note:el('memnote').value,foodId,img:item('food',foodId).img,data:dataUrl});save();go('memories');toast('回憶已儲存')};if(f){let r=new FileReader;r.onload=()=>commit(r.result);r.readAsDataURL(f)}else commit('')}
function mine(){return `<h2>我的 BakeLoop</h2><div class="hero">${photo('baking-together.jpg','')}<div class="hero-content"><h3>我的烘焙旅程</h3><p class="muted">收藏每次相聚的甜蜜時刻。</p></div></div><div class="grid section"><div class="card" style="text-align:center"><h2>${data.groups.length}</h2><span class="muted">我的活動</span></div><div class="card" style="text-align:center"><h2>${data.memories.length}</h2><span class="muted">我的回憶</span></div></div><div class="row section"><h3>最近的活動</h3><button class="btn secondary small" onclick="go('groups')">查看全部</button></div>${data.groups.length?data.groups.slice(0,2).map(groupCard).join(''):'<p class="muted">尚未建立活動。</p>'}<div class="row section"><h3>我的作品回憶</h3><button class="btn secondary small" onclick="go('memories')">查看更多</button></div>${data.memories.length?data.memories.slice(0,2).map(m=>memoryCard(m,false)).join(''):`<p class="muted">還沒有自己的作品，先看看下面的範例吧。</p>${samples.slice(0,2).map(m=>memoryCard(m,true)).join('')}`}<button class="btn secondary full" onclick="if(confirm('確定清除本機建立的活動與回憶？')){data={groups:[],memories:[]};save();go('mine')}">清除本機示範資料</button>`}
render();


let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;});
async function showInstallHelp(){
 if(deferredInstallPrompt){
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  return;
 }
 const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
 alert(ios?'iPhone / iPad：請使用 Safari 開啟網站，點選分享按鈕，再選「加入主畫面」。':'Android：使用 Chrome 開啟網站，點選瀏覽器選單中的「安裝應用程式」或「加入主畫面」。電腦版可透過 Chrome 網址列的安裝圖示安裝。');
}
function setViewMode(mode){
 const mobile=mode==='mobile';
 document.body.classList.toggle('force-mobile',mobile);
 try{localStorage.setItem('bakeloop-view-mode',mobile?'mobile':'auto')}catch(e){}
 for(const [id,active] of [['view-auto',!mobile],['view-mobile',mobile]]){const el=document.getElementById(id);el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active));}
 const main=document.getElementById('main');if(main)main.scrollTop=0;
}
try{setViewMode(localStorage.getItem('bakeloop-view-mode')==='mobile'?'mobile':'auto')}catch(e){setViewMode('auto')}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
